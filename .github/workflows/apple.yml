# Builds the native SwiftUI app (apple/) for iPhone and Mac, and takes simulator screenshots.
# Only runs when something under apple/ changes, so the web site deploy is unaffected.
name: Apple app

on:
  push:
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml']
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Game data is in sync with the web version
        run: |
          node apple/tools/export-game-data.js
          git diff --exit-code apple/Hireloot/Resources/GameData.json

      - name: Build for Mac
        run: |
          set -o pipefail
          xcodebuild -project apple/Hireloot.xcodeproj -scheme Hireloot -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build 2>&1 | tee build-mac.log | grep -E "error:|warning: .*Hireloot/|BUILD" || true
          test -d build/mac/Build/Products/Debug/Hireloot.app

      - name: Build for iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project apple/Hireloot.xcodeproj -scheme Hireloot -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build 2>&1 | tee build-ios.log | grep -E "error:|BUILD" || true
          test -d build/ios/Build/Products/Debug-iphonesimulator/Hireloot.app

      - name: iPhone screenshots
        run: bash apple/tools/screenshots.sh build/ios/Build/Products/Debug-iphonesimulator/Hireloot.app shots

      - name: App Store screenshots (full size)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[store]')
        run: bash apple/tools/store-shots.sh build/ios/Build/Products/Debug-iphonesimulator/Hireloot.app store-shots

      - name: Save App Store screenshots to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[store]')
        run: |
          mkdir -p apple/store/raw
          cp store-shots/*.png apple/store/raw/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple/store/raw
          git commit -m "Update raw App Store screenshots [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Mac App Store screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[macstore]')
        run: |
          bash apple/tools/mac-store-shots.sh build/mac/Build/Products/Debug/Hireloot.app mac-store
          mkdir -p apple/store/raw
          cp mac-store/*.png apple/store/raw/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple/store/raw
          git commit -m "Update raw Mac App Store screenshots [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Mac screenshot
        continue-on-error: true
        run: bash apple/tools/mac-screenshot.sh build/mac/Build/Products/Debug/Hireloot.app shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hireloot-apple
          path: |
            shots/
            build-*.log
          if-no-files-found: warn

      # Commit messages containing [screenshots] refresh apple/docs/ with the new screenshots
      - name: Save screenshots to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          mkdir -p apple/docs
          for f in shots/*.png; do sips -Z 1200 "$f" --out "apple/docs/$(basename "$f")" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple/docs
          git commit -m "Update app screenshots [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
