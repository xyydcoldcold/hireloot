# Builds the native SwiftUI app (apple/) for iPhone and Mac, and takes simulator screenshots.
# Only runs when something under apple/ changes, so the web site deploy is unaffected.
name: Apple app

on:
  push:
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml']
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Game data is in sync with the web version
        run: |
          node apple/tools/export-game-data.js
          git diff --exit-code apple/Hireloot/Resources/GameData.json

      - name: Build for Mac
        run: |
          set -o pipefail
          xcodebuild -project apple/Hireloot.xcodeproj -scheme Hireloot -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build 2>&1 | tee build-mac.log | grep -E "error:|warning: .*Hireloot/|BUILD" || true
          test -d build/mac/Build/Products/Debug/Hireloot.app

      - name: Build for iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project apple/Hireloot.xcodeproj -scheme Hireloot -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build 2>&1 | tee build-ios.log | grep -E "error:|BUILD" || true
          test -d build/ios/Build/Products/Debug-iphonesimulator/Hireloot.app

      - name: iPhone screenshots
        run: bash apple/tools/screenshots.sh build/ios/Build/Products/Debug-iphonesimulator/Hireloot.app shots

      - name: Mac screenshot
        continue-on-error: true
        run: bash apple/tools/mac-screenshot.sh build/mac/Build/Products/Debug/Hireloot.app shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hireloot-apple
          path: |
            shots/
            build-*.log
          if-no-files-found: warn
